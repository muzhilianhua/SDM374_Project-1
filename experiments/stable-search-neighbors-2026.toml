# Use --model-run explicitly; model field is a placeholder for the selected trained recipe.
[data]
dataset = "dataset_same8"
[model]
name = "stable-stack"
[optimizer]
name = "neighborhood-trust"
[optimizer.params]
radii = [0.02, 0.05]
iterations = 24
screening = 64
directions = 16
quantile = 0.8
prediction_budget = 12000
seed = 2026
risk = 1.0
max_distance_ratio = 0.75
[evaluate]
protocol = "frozen-v32"
top_k = 50
