# Template: copy to experiments/<name>.toml (no leading underscore) and edit.
# Files starting with "_" are hidden from the GUI's config list.

[data]
dataset = "dataset_same8"  # relative to the repo root

[model]
name = "ridge2"  # any name from `uv run sdm list`

[model.params]
# Only fields of the model's Params; omitted fields keep their defaults.
alphas = [0.1, 1.0, 10.0, 100.0, 1000.0]  # lists become tuples in the plugin's Params
folds = 5

[optimizer]  # needed only for `sdm optimize`
name = "pgd"

[optimizer.params]
starts = 16

[evaluate]  # team-wide protocol: do not change
folds = 5
seed = 2026
top_k = 50
