# Prespecified selection-conditioned study; see analysis/selection_training/README.md.
[data]
dataset = "dataset_same8"
[model]
name = "honest-stack"
[model.params]
seed = 2026
iterations = 600
[optimizer]
name = "neighborhood-trust"
