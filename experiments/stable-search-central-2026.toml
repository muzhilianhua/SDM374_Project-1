# Use --model-run explicitly; model field is a placeholder for the selected trained recipe.
[data]
dataset = "dataset_same8"
[model]
name = "stable-stack"
[optimizer]
name = "trust-dirichlet"
[optimizer.params]
iterations = 30
seed = 2026
risk = 1.0
max_distance_ratio = 0.75
[evaluate]
protocol = "frozen-v32"
top_k = 50
