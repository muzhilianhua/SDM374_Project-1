# Baseline quadratic ridge searched by the trust-region Dirichlet optimizer instead of pgd.

[data]
dataset = "dataset_same8"

[model]
name = "ridge2"

[optimizer]
name = "trust-dirichlet"

[optimizer.params]
risk = 1.0
max_distance_ratio = 1.5
seed = 2026

[evaluate]
folds = 5
seed = 2026
top_k = 50
