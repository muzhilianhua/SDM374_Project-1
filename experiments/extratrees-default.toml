# Extra-trees surrogate searched by the trust-region Dirichlet optimizer (gradient-free pair).

[data]
dataset = "dataset_same8"

[model]
name = "extratrees"

[model.params]
n_estimators = 300
min_samples_leaf = 2
max_features = 0.5
seed = 2026

[optimizer]
name = "trust-dirichlet"

[optimizer.params]
risk = 1.0
max_distance_ratio = 1.5
seed = 2026

[evaluate]
folds = 5
seed = 2026
top_k = 50
