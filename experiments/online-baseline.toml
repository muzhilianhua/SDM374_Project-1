# Online loop (T08) with the course baseline surrogate: a working default, not a tuned policy (T12, T15, T18).
# Graded run: `uv run sdm online -c experiments/online-baseline.toml` on the course computer with
# solver/solver.exe in place; it never touches solver/usage.count.

[data]
dataset = "dataset_same8"

[model]
name = "ridge2"

[optimizer]
name = "trust-dirichlet"

[optimizer.params]
seed = 2026

[policy]
name = "surrogate"   # refit [model] on all observations each call, then ask [optimizer] for a batch

[evaluator]
kind = "solver"      # "table" or "synthetic" for replay and tests

[evaluator.params]
timeout = 3600.0     # seconds per call; 50 sets took about 290 s on A's PC

[online]
calls = 20           # call budget; every solver attempt counts, including failed ones
batch_size = 50
seed = 2026
candidate_margin = 25
max_rounds = 3
max_retries = 1
dedupe_atol = 1e-9
