# Local Matern ARD GP (800 rows nearest the best row of each training split) on the frozen 2x5 splits.
# It is a local judge for steps near p01969; global v3.2 ranking is not what it is built for.

[data]
dataset = "dataset_same8"

[model]
name = "local-gp"

[model.params]
neighbors = 800
nu = 2.5
length_start = 0.5
length_min = 0.03
length_max = 10.0
seed = 0

[evaluate]
protocol = "frozen-v32"  # folds and seed come from frozen_data/; do not set them here
top_k = 50
