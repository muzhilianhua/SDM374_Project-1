# Extra-trees surrogate scored on the frozen 2x5 splits with the v3.2 score.

[data]
dataset = "dataset_same8"

[model]
name = "extratrees"

[model.params]
n_estimators = 300
min_samples_leaf = 2
max_features = 0.5
seed = 2026

[evaluate]
protocol = "frozen-v32"  # folds and seed come from frozen_data/; do not set them here
top_k = 50
