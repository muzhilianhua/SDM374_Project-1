[project]
name = "sdm374"
version = "0.1.0"
description = "SDM374 Project 1: surrogate models and optimizers for tuning building energy controllers"
readme = "README.md"
# numpy 1.24.4 (pinned by the course baseline) has no wheels for Python 3.12+.
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==1.24.4",
    "pandas==1.5.3",
    "scipy==1.10.1",
    "scikit-learn==1.2.2",
]

[project.scripts]
sdm = "sdm.cli:main"

[dependency-groups]
dev = ["pytest>=8"]
# Optional so graders can run the CLI without it: `uv sync --group gui`.
gui = ["streamlit>=1.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
